# MCP 文件服务 + Cloudflare Tunnel connector
# 用法: docker compose --env-file .env up -d

services:
  mcp-gateway:
    image: node:22-bookworm-slim
    container_name: gbd-mcp-gateway
    working_dir: /workspace
    volumes:
      - ${WORKSPACE_PATH}:/workspace:rw
    # 关键：预装 filesystem server 并直接调用其可执行文件。
    # 早期写法是 --stdio "npx -y @modelcontextprotocol/server-filesystem ..."，
    # stateless 模式下每个请求都会重跑一次 npx（解析+下载+起 node），
    # 几个并发请求就能把整台 VM 的 CPU/内存吃光，导致 sshd 和 nginx 一起僵死。
    command:
      - bash
      - -c
      - |
        set -eu
        npm install -g supergateway @modelcontextprotocol/server-filesystem
        BIN="$$(command -v mcp-server-filesystem || true)"
        if [ -z "$$BIN" ]; then BIN="npx -y @modelcontextprotocol/server-filesystem"; fi
        echo "using stdio: $$BIN /workspace"
        exec supergateway \
          --stdio "$$BIN /workspace" \
          --port ${MCP_PORT:-8000} \
          --host 0.0.0.0 \
          --outputTransport streamableHttp \
          --streamableHttpPath /mcp \
          --stateful \
          --sessionTimeout 600000
    ports:
      - "127.0.0.1:${MCP_PORT:-8000}:${MCP_PORT:-8000}"
    restart: unless-stopped
    # 兜底：即使再出现进程风暴，也只影响本容器，不会拖垮宿主机。
    # 宿主机总内存仅 891MB，上限必须给 mimic-dlp 和系统留出余量。
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:${MCP_PORT:-8000}/mcp',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: gbd-cloudflared
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN}
    depends_on:
      mcp-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks:
      default:
        aliases:
          - cloudflared

networks:
  default:
    name: gbd-mcp-net
