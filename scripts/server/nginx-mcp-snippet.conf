# 追加到现有 nginx server {} 内（如 /etc/nginx/sites-available/mimic-dlp）
# MCP streamable HTTP 反代，需关闭 buffering 以支持 SSE

    location = /mcp {
        # 已改用 conf.d/mcp-auth.conf 的 map 多 key 方案；此处仅为单 key 示例
        if ($http_authorization != "Bearer REPLACE_WITH_YOUR_KEY") {
            return 401;
        }

        proxy_pass http://127.0.0.1:8001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
