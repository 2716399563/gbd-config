# MCP over HTTPS：sslip.io 免费域名 + Let's Encrypt 证书
# 放到 /etc/nginx/sites-available/mcp-ssl 并软链到 sites-enabled
# 鉴权复用 conf.d/mcp-auth.conf 里的 $mcp_auth_ok（http 上下文的 map，多 key）

server {
    # nginx 1.18 用这种写法；1.25+ 才是独立的 http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 20-255-73-137.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/20-255-73-137.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/20-255-73-137.sslip.io/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:2m;
    ssl_session_timeout 1h;

    access_log /var/log/nginx/mcp-ssl.access.log;
    error_log  /var/log/nginx/mcp-ssl.error.log;

    location = /mcp {
        if ($mcp_auth_ok = 0) {
            return 401;
        }

        proxy_pass http://127.0.0.1:8001/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # MCP 走 SSE，必须关缓冲，否则响应会被 nginx 攒着不发
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 这个域名只对外提供 MCP，其余一律拒绝
    location / {
        return 404;
    }
}
